<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="75%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1b3f9c"/><stop offset=".5" stop-color="#0b1d4f"/><stop offset="1" stop-color="#050e2a"/>
    </radialGradient>
    <linearGradient id="helix" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b8cff"/><stop offset="1" stop-color="#9ad0ff"/>
    </linearGradient>
    <linearGradient id="mol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5cf6"/><stop offset="1" stop-color="#3bc7d9"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity=".04">
    <path d="M0 140H1600M0 280H1600M0 420H1600"/>
    <path d="M400 0V560M800 0V560M1200 0V560"/>
  </g>
  <!-- DNA helix -->
  <g fill="none" stroke="url(#helix)" stroke-width="5" stroke-linecap="round" opacity=".85" filter="url(#glow)">
    <path d="M850 40 C 950 120, 950 200, 850 280 S 750 440, 850 520"/>
    <path d="M950 40 C 850 120, 850 200, 950 280 S 1050 440, 950 520"/>
  </g>
  <g stroke="#7fb0ff" stroke-width="3" opacity=".55">
    <path d="M862 70H938M854 110H946M866 150H934M866 230H934M854 270H946M862 310H938M870 350H930M870 430H930M858 470H942"/>
  </g>
  <!-- molecule -->
  <g filter="url(#glow)">
    <g fill="none" stroke="#9ad0ff" stroke-width="3" opacity=".8">
      <path d="M1180 170L1270 120L1360 170L1360 270L1270 320L1180 270Z"/>
      <path d="M1360 170L1450 120L1540 170M1360 270L1450 320M1270 120L1270 40M1180 270L1090 320"/>
    </g>
    <g fill="url(#mol)">
      <circle cx="1180" cy="170" r="16"/><circle cx="1270" cy="120" r="22"/><circle cx="1360" cy="170" r="18"/>
      <circle cx="1360" cy="270" r="16"/><circle cx="1270" cy="320" r="20"/><circle cx="1180" cy="270" r="14"/>
      <circle cx="1450" cy="120" r="14"/><circle cx="1540" cy="170" r="24"/><circle cx="1450" cy="320" r="18"/>
      <circle cx="1270" cy="40" r="12"/><circle cx="1090" cy="320" r="12"/>
    </g>
  </g>
  <!-- spectrum trace -->
  <path d="M900 470 L930 460 L950 300 L965 470 L990 455 L1010 380 L1025 470 L1050 462 L1070 200 L1085 470 L1110 460 L1130 410 L1145 470 L1180 465 L1200 350 L1215 470 L1250 462 L1270 430 L1290 470 L1330 466 L1350 250 L1365 470 L1400 460 L1420 400 L1440 470 L1480 465 L1500 320 L1515 470 L1560 466 L1600 470"
        fill="none" stroke="#5fd3ff" stroke-width="2.5" opacity=".8"/>
  <!-- particles -->
  <g fill="#ffffff" opacity=".5">
    <circle cx="520" cy="90" r="2"/><circle cx="840" cy="130" r="1.5"/><circle cx="980" cy="60" r="2"/><circle cx="1120" cy="90" r="1.5"/>
    <circle cx="760" cy="420" r="2"/><circle cx="1500" cy="420" r="2"/><circle cx="1050" cy="520" r="1.5"/><circle cx="880" cy="250" r="2"/>
  </g>
</svg>
